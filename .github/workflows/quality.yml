name: Tracker quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  javascript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.cjs
      - run: node --check strict_engine.js && node --check strict_rules.js
      - run: python tests/check_inline_script.py
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m compileall -q server.py tests
      - run: pytest -q
