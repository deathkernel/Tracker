name: Tracker quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  javascript-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.cjs
      - run: python tests/check_inline_script.py

  python-tests:
    name: Python tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m compileall -q server.py tests
      - run: python -m pytest -q

  browser-e2e:
    name: Browser end-to-end (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest httpx playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_browser_e2e.py

  windows-startup-smoke:
    name: Windows run.bat smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: pwsh
        run: |
          $env:TRACKER_HOST = "127.0.0.1"
          $env:TRACKER_DB_PATH = Join-Path $env:RUNNER_TEMP "tracker-smoke.db"
          $stdout = Join-Path $env:RUNNER_TEMP "tracker-runner.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "tracker-runner.stderr.log"
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "run.bat" -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $ready = $false
          try {
            $deadline = (Get-Date).AddMinutes(4)
            do {
              if ($process.HasExited) {
                Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
                throw "run.bat exited before the Tracker health endpoint became ready."
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/health" -TimeoutSec 2
                if ($health.status -eq "ok") {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 2
              }
            } while ((Get-Date) -lt $deadline)
            if (-not $ready) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "run.bat did not start a healthy Tracker server within four minutes."
            }
            $dashboard = Invoke-WebRequest -Uri "http://127.0.0.1:8000/" -TimeoutSec 10
            if ($dashboard.StatusCode -ne 200) {
              throw "The Tracker dashboard did not return HTTP 200."
            }
          } finally {
            $listener = Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($listener) {
              Stop-Process -Id $listener.OwningProcess -Force -ErrorAction SilentlyContinue
            }
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }
