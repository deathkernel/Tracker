<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <title>UPSC Prelims Tracker</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font:16px/1.5 system-ui,sans-serif;background:#f5f7fb;color:#182230}
    main{max-width:560px;margin:8vh auto;padding:24px}section{background:#fff;border:1px solid #e5eaf1;border-radius:16px;padding:24px}
    h1{font-size:24px;margin:0 0 8px}p{color:#596579}label{display:block;font-weight:650;margin:18px 0 6px}
    input,button{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid #d8deea}
    button{margin-top:12px;background:#315efb;color:white;border-color:#315efb;font-weight:700}
    #status{font-size:13px;min-height:40px}small{color:#687586}
  </style>
</head>
<body>
<main><section>
  <h1>UPSC Prelims Tracker</h1>
  <p>This native app shell connects to your existing Tracker server. Your study data remains on that server.</p>
  <label for="server">Tracker server URL</label>
  <input id="server" type="url" placeholder="http://192.168.1.10:8000" autocomplete="url">
  <button id="connect">Connect to Tracker</button>
  <p id="status" role="status" aria-live="polite">Enter the URL shown by your Tracker host PC.</p>
  <small>Use a trusted private Wi-Fi network. Do not expose the Tracker server directly to the internet.</small>
</section></main>
<script>
const input=document.getElementById('server'),status=document.getElementById('status');
input.value=localStorage.getItem('tracker-server-url')||'';
document.getElementById('connect').addEventListener('click',async()=>{
 const value=input.value.trim().replace(/\/$/,'');
 let url;try{url=new URL(value)}catch{status.textContent='Enter a valid server URL.';return}
 if(!['http:','https:'].includes(url.protocol)){status.textContent='Only HTTP or HTTPS server URLs are supported.';return}
 status.textContent='Checking Tracker connection…';
 try{
  const response=await fetch(value+'/api/health',{headers:{Accept:'application/json'}});
  if(!response.ok)throw new Error('Server returned '+response.status);
  const result=await response.json();
  if(result.status!=='ok')throw new Error('Tracker health check failed');
  localStorage.setItem('tracker-server-url',value);
  status.textContent='Server is reachable. Native wrapper is connected; full dashboard integration requires the server URL to be wired into the web app build.';
 }catch(error){status.textContent='Could not connect: '+error.message+'. Check the URL, Wi-Fi and server status.'}
});
</script>
</body></html>
